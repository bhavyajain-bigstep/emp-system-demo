$kind: http-example
request:
  url: "{{baseUrl}}/departments"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "Engineering",
        "managerId": "string"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Something went wrong",
        "error": {
          "code": "SOME_ERROR_CODE"
        }
      }
order: 3000
