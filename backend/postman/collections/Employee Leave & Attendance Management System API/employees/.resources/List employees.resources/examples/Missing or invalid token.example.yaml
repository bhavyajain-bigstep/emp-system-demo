$kind: http-example
request:
  url: "{{baseUrl}}/employees?page=1&limit=10&departmentId=string&status=INACTIVE"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    page: "1"
    limit: "10"
    departmentId: string
    status: INACTIVE
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Something went wrong",
        "error": {
          "code": "SOME_ERROR_CODE"
        }
      }
order: 2000
