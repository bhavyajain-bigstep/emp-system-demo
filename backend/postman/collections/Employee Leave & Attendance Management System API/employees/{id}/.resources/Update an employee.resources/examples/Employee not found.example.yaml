$kind: http-example
request:
  url: "{{baseUrl}}/employees/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "name": "string",
        "role": "MANAGER",
        "managerId": "string",
        "departmentId": "string",
        "timezone": "string",
        "status": "SUSPENDED"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Something went wrong",
        "error": {
          "code": "SOME_ERROR_CODE"
        }
      }
order: 4000
