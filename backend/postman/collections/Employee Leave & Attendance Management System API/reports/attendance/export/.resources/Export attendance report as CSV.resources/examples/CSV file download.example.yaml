$kind: http-example
request:
  url: "{{baseUrl}}/reports/attendance/export?employeeId=string&departmentId=string&status=string&from=string&to=string"
  method: GET
  headers:
    - key: Accept
      value: text/csv
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    employeeId: string
    departmentId: string
    status: string
    from: string
    to: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/csv
  body:
    type: text
    content: string
order: 1000
