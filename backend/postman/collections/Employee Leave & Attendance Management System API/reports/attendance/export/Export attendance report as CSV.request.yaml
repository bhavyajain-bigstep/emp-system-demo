$kind: http-request
url: "{{baseUrl}}/reports/attendance/export?employeeId=string&departmentId=string&status=string&from=string&to=string"
method: GET
headers:
  Accept: text/csv
queryParams:
  employeeId: string
  departmentId: string
  status: string
  from: string
  to: string
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Export attendance report as CSV.resources/examples
order: 1000
