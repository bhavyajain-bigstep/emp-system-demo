$kind: http-example
request:
  url: "{{baseUrl}}/leave-types"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "name": "Casual Leave",
        "code": "CL",
        "maxDays": 12,
        "description": "Leave for personal or casual purposes",
        "isPaid": true,
        "carryForward": false
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Leave type created successfully",
        "data": {
          "_id": "string",
          "name": "Casual Leave",
          "code": "CL",
          "annualQuota": 12,
          "rules": {
            "allowNegativeBalance": false,
            "excludeWeekends": true,
            "excludeMandatoryHolidays": true,
            "allowHalfDay": true,
            "allowCancellation": true,
            "maxConsecutiveDays": 5,
            "minNoticeDays": 2
          },
          "status": "ACTIVE"
        }
      }
order: 1000
