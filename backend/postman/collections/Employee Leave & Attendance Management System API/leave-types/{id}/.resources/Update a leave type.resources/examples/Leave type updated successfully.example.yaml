$kind: http-example
request:
  url: "{{baseUrl}}/leave-types/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "name": "Casual Leave",
        "code": "CL",
        "description": "Leave for personal or casual purposes",
        "maxDays": 15,
        "isPaid": true,
        "carryForward": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Leave type updated successfully",
        "data": {
          "_id": "string",
          "name": "Casual Leave",
          "code": "CL",
          "annualQuota": 12,
          "rules": {
            "allowNegativeBalance": false,
            "excludeWeekends": true,
            "excludeMandatoryHolidays": true,
            "allowHalfDay": true,
            "allowCancellation": true,
            "maxConsecutiveDays": 5,
            "minNoticeDays": 2
          },
          "status": "ACTIVE"
        }
      }
order: 1000
