$kind: http-example
request:
  url: "{{baseUrl}}/attendance/check-in"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Checked in successfully",
        "data": {
          "_id": "string",
          "employeeId": "string",
          "date": "2026-08-18",
          "checkInAt": "1952-04-14T07:37:58.136Z",
          "checkOutAt": "1973-10-23T17:21:04.780Z",
          "status": "PRESENT",
          "timezone": "Asia/Kolkata",
          "createdAt": "1951-07-13T12:01:24.090Z",
          "updatedAt": "2022-09-21T16:45:16.369Z"
        }
      }
order: 1000
