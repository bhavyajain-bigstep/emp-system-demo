$kind: http-example
request:
  url: "{{baseUrl}}/attendance/summary?employeeId=string&year=2026&month=8"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: employeeId
      value: string
      description: Optional for Managers/HR to view team/employee summary. Defaults to authenticated employee.
    - key: year
      value: "2026"
    - key: month
      value: "8"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Monthly attendance summary fetched successfully",
        "data": {
          "value": "reference #/components/schemas/MonthlyAttendanceSummary not found in the OpenAPI spec"
        }
      }
order: 1000
