$kind: http-example
request:
  url: "{{baseUrl}}/attendance/check-out"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Checked out successfully",
        "data": {
          "_id": "string",
          "employeeId": "string",
          "date": "2026-08-18",
          "checkInAt": "1991-08-09T14:37:55.148Z",
          "checkOutAt": "2021-03-31T13:10:37.075Z",
          "status": "PRESENT",
          "timezone": "Asia/Kolkata",
          "createdAt": "1977-08-13T09:13:54.348Z",
          "updatedAt": "1997-01-02T11:23:33.143Z"
        }
      }
order: 1000
